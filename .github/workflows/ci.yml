name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

      - name: schema.ts sem migration pendente
        run: |
          npx drizzle-kit generate
          if [ -n "$(git status --porcelain lib/db/migrations)" ]; then
            git status --porcelain lib/db/migrations
            echo "::error::schema.ts mudou sem migration. Rode npm run db:generate (ou commit com [sync-lock])."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Aplicar migrations no banco de teste
        env:
          DATABASE_URL_UNPOOLED: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS vector"
          npx drizzle-kit migrate

      - name: Proxy HTTP do Neon (driver neon-http contra o Postgres local)
        run: |
          docker run -d --name neon-proxy --network "${{ job.services.postgres.network }}" -p 4444:4444 \
            -e PG_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/postgres \
            ghcr.io/timowilhelm/local-neon-http-proxy:main
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:4444 && break
            sleep 1
          done

      - name: Testes
        env:
          DATABASE_URL: postgres://postgres:postgres@db.localtest.me:5432/postgres
        run: npm test
